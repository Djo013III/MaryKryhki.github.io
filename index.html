<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tap Dot</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:#1a1a2e;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:env(safe-area-inset-top,8px);left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:16px;text-shadow:0 2px 6px #000a;pointer-events:none;z-index:5}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,8px) + 12px);left:0;right:0;text-align:center;color:#fff6;font-size:13px;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="hL"></span><span id="hR"></span></div>
<div id="hint">Тапай по кружкам. Не успел — минус жизнь</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const hL = document.getElementById('hL');
const hR = document.getElementById('hR');

let W = 0, H = 0;
const DPR = Math.min(devicePixelRatio || 1, 2);

const START_LIVES = 3;
const DOT_LIFE = 90;

let dot, score, combo, lives, over, t, particles, spawnDelay, shake, overFade, inited = false;

function getBest(){ return +localStorage.getItem('tap_best') || 0; }
function saveBest(){ if (score > getBest()) localStorage.setItem('tap_best', score); }

function reset(){
  dot = null;
  score = 0;
  combo = 1;
  lives = START_LIVES;
  over = false;
  overFade = 0;
  t = 0;
  particles = [];
  spawnDelay = 10;
  shake = 0;
  inited = true;
}

function resize(){
  W = innerWidth; H = innerHeight;
  c.width = W * DPR; c.height = H * DPR;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);

function spawnDot(){
  const r = 26 + Math.random() * 20;
  dot = {
    x: r + 20 + Math.random() * (W - r * 2 - 40),
    y: r + 100 + Math.random() * (H - r * 2 - 200),
    r,
    life: DOT_LIFE
  };
}

function loseLife(){
  lives--;
  shake = 12;
  combo = 1;
  dot = null;
  spawnDelay = 20;
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 5;
    particles.push({
      x: W / 2, y: H / 2,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 30, maxLife: 30, color: '#e94560', r: 3 + Math.random() * 3
    });
  }
  if (lives <= 0) {
    over = true;
    overFade = 0;
    shake = 0; // не трясём финальный экран
    saveBest();
  }
}

function handleTap(x, y){
  if (!inited) return;
  if (over) { reset(); return; }
  if (dot) {
    const dx = x - dot.x, dy = y - dot.y;
    if (dx * dx + dy * dy < (dot.r + 12) * (dot.r + 12)) {
      score += combo;
      combo = Math.min(combo + 1, 9);
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 6;
        particles.push({
          x: dot.x, y: dot.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
          life: 30, maxLife: 30, color: '#e94560', r: 2 + Math.random() * 3
        });
      }
      dot = null;
      spawnDelay = 6;
    } else {
      combo = 1;
    }
  }
}

addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });
addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON') return;
  handleTap(e.clientX, e.clientY);
});

function update(){
  if (!inited) return;

  // затухание тряски — обнуляем, когда станет совсем мало
  if (shake > 0) {
    shake *= 0.82;
    if (shake < 0.5) shake = 0;
  }

  // плавное появление оверлея
  if (over) {
    if (overFade < 1) overFade = Math.min(1, overFade + 0.06);
    // частицы продолжают жить
    particles.forEach(p => {
p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.vx *= 0.98; p.life--;
    });
    particles = particles.filter(p => p.life > 0);
    return;
  }

  t++;

  if (dot) {
    dot.life--;
    if (dot.life <= 0) loseLife();
  } else if (spawnDelay > 0) {
    spawnDelay--;
  } else {
    spawnDot();
  }

  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.vx *= 0.98; p.life--;
  });
  particles = particles.filter(p => p.life > 0);
}

function drawHeart(x, y, s, filled){
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y - s * 0.1, x - s, y - s * 0.1, x - s, y + s * 0.3);
  ctx.bezierCurveTo(x - s, y + s * 0.7, x, y + s * 0.9, x, y + s * 1.1);
  ctx.bezierCurveTo(x, y + s * 0.9, x + s, y + s * 0.7, x + s, y + s * 0.3);
  ctx.bezierCurveTo(x + s, y - s * 0.1, x, y - s * 0.1, x, y + s * 0.3);
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = '#e94560';
    ctx.fill();
  } else {
    ctx.strokeStyle = '#e9456066';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function draw(){
  // фон — всегда без тряски
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1a2e');
  g.addColorStop(1, '#16213e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // === игровое поле — с тряской (только если не over) ===
  if (!over) {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    if (dot) {
      const pct = dot.life / DOT_LIFE;
      ctx.strokeStyle = '#ffffff22';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.r + 12, 0, 7); ctx.stroke();
      ctx.strokeStyle = pct > 0.5 ? '#6fcf97' : pct > 0.25 ? '#f2c94c' : '#e94560';
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.r + 12, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
      ctx.stroke();

      const pulse = 1 + Math.sin(t * 0.15) * 0.04;
      ctx.save();
      ctx.shadowColor = '#e94560';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.r * pulse, 0, 7);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(dot.x - dot.r * 0.3, dot.y - dot.r * 0.3, dot.r * 0.25, 0, 7);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('×' + combo, dot.x, dot.y + 7);
    }

    ctx.restore();
  }

  // частицы — без тряски, рисуем поверх
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.life / p.maxLife), 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // сердечки — без тряски
  const hs = 11;
  for (let i = 0; i < START_LIVES; i++) {
    drawHeart(24 + i * (hs * 2 + 10), 56, hs, i < lives);
  }

  hL.textContent = 'Счёт: ' + score + '   ×' + combo;
  hR.textContent = 'Рекорд: ' + getBest();

  // === Game Over — отдельно, с плавным fade-in и БЕЗ тряски ===
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,' + (0.6 * overFade) + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = overFade;
    ctx.textAlign = 'center';

    // панель
    const pw = Math.min(W - 40, 340);
    const ph = 260;
    const px = (W - pw) / 2;
    const py = (H - ph) / 2;
    ctx.fillStyle = 'rgba(26,26,46,0.95)';
    ctx.strokeStyle = '#e94560';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 30;
    ctx.beginPath();
    const r = 18;
    ctx.moveTo(px + r, py);
    ctx.arcTo(px + pw, py, px + pw, py + ph, r);
    ctx.arcTo(px + pw, py + ph, px, py + ph, r);
    ctx.arcTo(px, py + ph, px, py, r);
    ctx.arcTo(px, py, px + pw, py, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px system-ui';
    ctx.fillText('Игра окончена', W / 2, py + 60);

    ctx.font = 'bold 22px system-ui';
ctx.fillStyle = '#f2c94c';
    ctx.fillText('Счёт: ' + score, W / 2, py + 110);

    ctx.font = '16px system-ui';
    ctx.fillStyle = '#fff8';
    ctx.fillText('Рекорд: ' + getBest(), W / 2, py + 145);

    ctx.font = 'bold 16px system-ui';
    ctx.fillStyle = '#e94560';
    ctx.fillText('Тап — заново', W / 2, py + ph - 30);
    ctx.restore();
  }
}

resize();
reset();
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
